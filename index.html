<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #212121;
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* De ton als watermark, gecentreerd achter alles */
  .watermark {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .watermark svg {
    height: min(80vh, 110vw);
    opacity: 0.07;
  }

  main {
    position: relative;
    text-align: center;
    z-index: 1;
  }

  .wordmark {
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Anton', 'Arial Narrow', sans-serif;
    font-size: 10.5vw;
    line-height: 1.05;
    white-space: nowrap;
    color: #FFD400;
    letter-spacing: 0.005em;
    transition: transform 0.25s ease;
  }
  .wordmark:hover { transform: scale(1.015); }
  .wordmark:focus-visible {
    outline: 0.2vw solid #FFD400;
    outline-offset: 1vw;
  }

  /* Dichtgeklapt neemt het blok geen ruimte in (max-height 0), zodat de
     naam exact gecentreerd staat; uitklappen schuift de naam omhoog.
     De inhoud start boven de maskerrand (achter de titel) en glijdt
     bij openen naar beneden het zicht in. */
  .contact {
    margin-top: 0;
    max-height: 0;
    overflow: hidden;
    visibility: hidden;
    transition: max-height 0.55s ease, margin-top 0.55s ease, visibility 0.55s;
  }
  body.open .contact {
    margin-top: 2.5vw;
    max-height: 20vw;
    visibility: visible;
  }
  .contact-slide {
    display: flex;
    flex-direction: column;
    gap: 1.4vw;
    transform: translateY(-110%);
    transition: transform 0.55s ease;
  }
  body.open .contact-slide {
    transform: translateY(0);
  }

  .tagline {
    font-family: system-ui, sans-serif;
    font-size: 1.9vw;
    line-height: 1.5;
    color: #9a9a9a;
    letter-spacing: 0.04em;
    margin-bottom: 0.8vw;
  }

  .contact a {
    font-family: system-ui, sans-serif;
    font-size: 2.6vw;
    color: #e8e8e8;
    text-decoration: none;
    letter-spacing: 0.04em;
  }
  .contact a:hover { color: #FFD400; }
</style>
</head>

<script>
  var LINKEDIN_URL = "https://www.linkedin.com/in/ton-bosma-07468b111/";

  var wordmark = document.getElementById('wordmark');
  var emailLink = document.getElementById('email');
  var linkedinLink = document.getElementById('linkedin');
  var emailSet = false;

  if (LINKEDIN_URL) {
    linkedinLink.href = LINKEDIN_URL;
    linkedinLink.hidden = false;
  }

  wordmark.addEventListener('click', function () {
    var open = document.body.classList.toggle('open');
    wordmark.setAttribute('aria-expanded', open);

    // E-mailadres pas na klik samenstellen, zodat het nooit
    // als leesbare tekst in de HTML-bron staat (anti-spam-harvester).
    if (open && !emailSet) {
      var d = ['info', 'gettingthingston', 'nl'];
      var adres = d[0] + '@' + d[1] + '.' + d[2];
      emailLink.href = 'mailto:' + adres;
      emailLink.textContent = adres;
      emailSet = true;
    }
  });
